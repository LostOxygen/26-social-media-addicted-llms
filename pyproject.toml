[project]
name = "social-media-addicted-llms"
version = "0.1.0"
description = "Do vision LLMs procrastinate with short-form video instead of solving benchmark tasks?"
requires-python = ">=3.12,<3.13"
dependencies = [
    "vllm>=0.11",
    "openai>=1.50",
    "datasets>=3.0",
    "huggingface_hub>=0.30",
    "pandas>=2.2",
    "pyarrow>=17",
    "pydantic>=2.8",
    "tqdm>=4.66",
    "yt-dlp>=2026.1",
    "curl_cffi>=0.7",
    "faster-whisper>=1.1",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "pillow>=10",
    "requests>=2.31",
]

[tool.uv]
package = false
